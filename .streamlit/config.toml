# .streamlit/config.toml
# ⚙️ إعدادات تطبيق SmartAgri - المنصة الزراعية الذكية

# ============================================================
# 🎨 إعدادات المظهر (Theme) - Green Nature Palette 🌿
# ============================================================
[theme]
# الألوان الأساسية
primaryColor = "#2E7D32"              # اللون الأساسي (أخضر زمردي) - للأزرار والعناصر التفاعلية
backgroundColor = "#E8F5E9"           # لون الخلفية (أخضر فاتح جداً)
secondaryBackgroundColor = "#FFFFFF"  # لون الخلفية الثانوي (أبيض) - للبطاقات والسايدبار
textColor = "#1B3A1B"                 # لون النص (أخضر داكن)
# ✅ إعدادات الخطوط
font = "sans serif"                   # نوع الخط

# ============================================================
# 🧭 إعدادات الواجهة (Client)
# ============================================================
[client]
# إيقاف قائمة التنقل التلقائية بتاعة Streamlit لصفحات pages/
# عشان نستخدم بس القائمة المخصصة في components/sidebar.py
showSidebarNavigation = false

# ============================================================
# 🖥️ إعدادات الخادم (Server)
# ============================================================
[server]
# حجم الملفات المرفوعة (بالـ MB)
maxUploadSize = 20
# السماح بـ CORS
enableCORS = true
# حماية من هجمات CSRF
enableXsrfProtection = true

# ============================================================
# 🌐 إعدادات المتصفح (Browser)
# ============================================================
[browser]
# إيقاف جمع إحصائيات الاستخدام
gatherUsageStats = false

# ============================================================
# 🏃 إعدادات التشغيل (Runner)
# ============================================================
[runner]
# تمكين الـ Magic Commands (مثل st.write)
magicEnabled = true

# ============================================================
# 📝 إعدادات التسجيل (Logger)
# ============================================================
[logger]
# مستوى التسجيل: error, warning, info, debug
level = "info"

# ============================================================
# 🌍 إعدادات عامة (Global)
# ============================================================
[global]
# وضع التطوير (true/false)
developmentMode = false

# ============================================================
# 📊 إعدادات عرض البيانات (DataFrame)
# ============================================================
[dataFrame]
# عدد الصفوف المعروضة افتراضياً
defaultRows = 10

# ============================================================
# 🔧 إعدادات متقدمة
# ============================================================
# الحد الأقصى لحجم الرسالة (بالـ MB)
# maxMessageSize = 200
# مهلة الاتصال (بالثواني)
# server.maxMessageSize = 200
